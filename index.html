<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор систем счисления</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-container">
        <div class="header">
            <span class="logo">Ramondrole</span>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Userful_functions/" class="back-button">⏎ назад</a>
        </div>

        <div class="calc-title">◈ СЧИСЛЕНИЯ ◈</div>

        <div class="converter-grid">
            <div class="input-group">
                <label for="inputNumber">✜ введите число</label>
                <input type="text" id="inputNumber" class="input-field" placeholder="1010, 0xFF, 777..." value="1010">
            </div>

            <div class="select-row">
                <div class="select-item">
                    <label for="baseFrom">⬇ из системы</label>
                    <select id="baseFrom" class="cyber-select">
                        <option value="2">BIN (2)</option>
                        <option value="8">OCT (8)</option>
                        <option value="10" selected>DEC (10)</option>
                        <option value="16">HEX (16)</option>
                    </select>
                </div>
                <div class="select-item">
                    <label for="baseTo">⬆ в систему</label>
                    <select id="baseTo" class="cyber-select">
                        <option value="2">BIN (2)</option>
                        <option value="8">OCT (8)</option>
                        <option value="10">DEC (10)</option>
                        <option value="16" selected>HEX (16)</option>
                    </select>
                </div>
            </div>

            <button class="convert-btn" id="convertBtn">#ПЕРЕВЕСТИ</button>

            <div class="result-block">
                <div class="result-label">🔷 РЕЗУЛЬТАТ 🔷</div>
                <div id="resultDisplay" class="result-value">3F2</div>
                <div id="errorDisplay" class="error-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
