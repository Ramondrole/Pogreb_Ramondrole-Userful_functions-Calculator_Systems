<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramondrole - Калькулятор систем</title>
    <link rel="icon" href="./Ramondrole.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="systems-calculator.css">
</head>
<body>
    <nav>
        <div class="logo">RAMONDROLE</div>
        <div class="nav-links">
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-About_me/" data-key="about">Обо мне</a>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Games/" data-key="games">Наши игры</a>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Userful_functions/" data-key="functions">Полезные функции</a>
        </div>
        <div class="language-switcher">
            <button class="lang-btn" id="langBtn">🌐 RU</button>
            <ul class="lang-dropdown">
                <li><a href="#" data-lang="ru">🇷🇺 Русский</a></li>
                <li><a href="#" data-lang="en">🇺🇸 English</a></li>
                <li><a href="#" data-lang="de">🇩🇪 Deutsch</a></li>
            </ul>
        </div>
    </nav>

    <div class="systems-wrapper">
        <h1 class="calc-title" data-key="title">◈ СЧИСЛЕНИЯ ◈</h1>

        <div class="converter-grid">
            <div class="input-group">
                <label for="inputNumber" data-key="enterNumber">✜ введите число</label>
                <input type="text" id="inputNumber" class="input-field" placeholder="1010, 0xFF, 777..." value="1010">
            </div>

            <div class="select-row">
                <div class="select-item">
                    <label for="baseFrom" data-key="fromSystem">⬇ из системы</label>
                    <select id="baseFrom" class="cyber-select">
                        <option value="2">BIN (2)</option>
                        <option value="8">OCT (8)</option>
                        <option value="10" selected>DEC (10)</option>
                        <option value="16">HEX (16)</option>
                    </select>
                </div>
                <div class="select-item">
                    <label for="baseTo" data-key="toSystem">⬆ в систему</label>
                    <select id="baseTo" class="cyber-select">
                        <option value="2">BIN (2)</option>
                        <option value="8">OCT (8)</option>
                        <option value="10">DEC (10)</option>
                        <option value="16" selected>HEX (16)</option>
                    </select>
                </div>
            </div>

            <button class="convert-btn" id="convertBtn" data-key="convertBtn">#ПЕРЕВЕСТИ</button>

            <div class="result-block">
                <div class="result-label" data-key="result">🔷 РЕЗУЛЬТАТ 🔷</div>
                <div id="resultDisplay" class="result-value">3F2</div>
                <div id="errorDisplay" class="error-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="systems-calculator.js"></script>
</body>
</html>
